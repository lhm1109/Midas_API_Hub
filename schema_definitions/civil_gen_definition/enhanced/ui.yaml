# ============================================================================
# UI RULES - UI 렌더링 통합 규칙
# ============================================================================
# Builder/Table/HTML 렌더링을 위한 통합 규칙
# 공통 규칙은 shared.yaml에서 상속
# ============================================================================

version: "1.0.0"
extends: "./shared.yaml"

# ============================================================================
# LAYOUT - 레이아웃 공통 규칙
# ============================================================================
layout:
  # 섹션 헤더 (x-ui.sectionId 기반 - x-ui.group deprecated)
  sectionHeader:
    enabled: true
    icon: "📋"
    style:
      borderTop: "border-t-2 border-cyan-800/50"
      textColor: "text-cyan-400"
      fontSize: "text-sm"
      fontWeight: "font-semibold"
      padding: "pt-4 pb-2"
      firstSection:
        borderTop: false

  # 필드 그룹화
  fieldGrouping:
    enabled: true
    groupBy: "x-ui.sectionId"  # 🔥 x-ui.group deprecated

  # 중첩 객체
  nestedObject:
    accordion: true
    checkbox: true
    style:
      border: "border-zinc-700"
      background: "bg-zinc-900/50"
      headerBackground: "bg-zinc-800/50"

# ============================================================================
# MARKER INTERPRETATION - x-* 마커 UI 해석 규칙
# ============================================================================
# ⚠️ 핵심 원칙: x-* 마커는 순수 UI 표현용
#   - 삭제해도 검증 동작에 영향 없음
#   - 검증 로직은 표준 JSON Schema (allOf if/then) 사용
#
# 이 섹션은 UI가 각 x-* 마커를 어떻게 해석하고 렌더링할지 정의
# ============================================================================
markerInterpretation:
  # ────────────────────────────────────────────────────────────────────────────
  # x-ui: 필드 메타데이터 (label, hint, groupId)
  # ────────────────────────────────────────────────────────────────────────────
  x-ui:
    enabled: true
    purpose: "필드 라벨, 힌트, 그룹 등 UI 메타데이터"
    rendering:
      label:
        source: "x-ui.label"
        fallback: "key"  # x-ui.label 없으면 필드 키 사용
        style: { fontWeight: "font-medium", color: "text-zinc-200" }
      hint:
        source: "x-ui.hint"
        position: "below"
        style: { color: "text-amber-400", fontSize: "text-[10px]", icon: "💡" }
      groupId:
        source: "x-ui.groupId"
        useFor: "section-grouping"
      # ⚠️ sectionId deprecated - sectionRegistry does not exist

  # ────────────────────────────────────────────────────────────────────────────
  # x-enum-labels: enum 값에 대한 라벨
  # ────────────────────────────────────────────────────────────────────────────
  x-enum-labels:
    enabled: true
    purpose: "enum 값에 대응하는 UI 라벨"
    rendering:
      format: "value - label"
      display: "select-options"  # Select 컴포넌트에서 표시
      tableDisplay: "list"       # 테이블에서 리스트로 표시

  # ────────────────────────────────────────────────────────────────────────────
  # x-enum-labels-by-type: TYPE별 enum 라벨
  # ⚠️ 실제 enum 값 목록은 allOf[].if.then.properties.*.enum에서 가져옴
  # ────────────────────────────────────────────────────────────────────────────
  x-enum-labels-by-type:
    enabled: true
    purpose: "TYPE 조건에 따른 enum 라벨 (UI 표시용만)"
    triggerField: "TYPE"
    rendering:
      format: "value - label"
      dynamicUpdate: true  # TYPE 변경 시 라벨 동적 업데이트
      tableDisplay: "grouped-by-type"
    note: |
      실제 enum 값 목록은 스키마의 allOf[].if.then에서 읽어옴
      이 마커는 라벨만 제공

  # ────────────────────────────────────────────────────────────────────────────
  # x-uiRules: UI 가시성/동작 규칙
  # ⚠️ 검증은 allOf if/then, 이것은 순수 UI 가시성
  # ────────────────────────────────────────────────────────────────────────────
  x-uiRules:
    enabled: true
    purpose: "필드 가시성 조건 (UI only)"
    conditions:
      visibleWhen:
        description: "지정된 조건 충족 시 필드 표시"
        hideMode: "remove"  # 조건 불충족 시 DOM에서 제거
        evaluateOn: "change"

# ============================================================================
# LEGACY COMPATIBILITY - 레거시 마커 호환 (deprecated)
# ============================================================================
# ⚠️ 아래 마커들은 deprecated이며 새 스키마에서 사용 금지
# 기존 스키마 호환을 위해 UI에서 여전히 읽지만, 새로 작성 시
# 표준 allOf if/then + x-optional-when 사용 권장
legacyMarkers:
  x-required-by-type:
    deprecated: true
    migrateTo: "allOf[].if.then.required"
    uiInterpretation: "Required 상태 표시에 사용, 새 스키마는 allOf 사용"
  x-enum-by-type:
    deprecated: true
    migrateTo: "allOf[].if.then.properties.*.enum"
    uiInterpretation: "동적 enum 표시에 사용, 새 스키마는 allOf + x-enum-labels-by-type 사용"
  x-node-count-by-type:
    deprecated: true
    migrateTo: "allOf[].if.then.properties.NODE.minItems/maxItems"
    uiInterpretation: "노드 개수 힌트 표시에 사용, 새 스키마는 allOf 사용"
  # ✅ x-required-when, x-optional-when은 현재 시스템의 표준
  x-required-when:
    deprecated: false
    purpose: "조건부 필수 - 조건 만족 시 필수 + 표시"
    uiInterpretation: "Conditional(필수) 상태 표시 + 조건별 그룹화"
  x-optional-when:
    deprecated: false
    purpose: "조건부 선택 - 조건 만족 시 선택 + 표시"
    uiInterpretation: "Conditional(선택) 상태 표시 + 조건별 그룹화"

# ============================================================================
# RENDERING - 렌더링 공통 규칙
# ============================================================================
rendering:
  requiredIndicator:
    enabled: true
    symbol: "*"
    color: "text-red-400"

  description:
    enabled: true
    source: "x-ui.label"
    fallback: "key"
    position: "inline"
    style:
      color: "text-zinc-200"
      fontSize: "text-sm"

  typeIndicator:
    enabled: true
    position: "right"
    style:
      color: "text-zinc-600"
      fontSize: "text-[10px]"
      fontFamily: "font-mono"

  hintDisplay:
    enabled: true
    position: "below"
    sources:
      - "x-ui.hint"
      - "x-value-constraint"
      - "x-node-count-by-type"
    style:
      color: "text-amber-400"
      fontSize: "text-[10px]"
      fontStyle: "italic"
      icon: "💡"

# ============================================================================
# VALIDATION DISPLAY - 검증 표시
# ============================================================================
validation:
  standard:
    enabled: true
    badge: "STD"
    badgeColor: "bg-blue-900/50 text-blue-300 border-blue-700/50"

  appLayer:
    enabled: true
    badge: "APP"
    badgeColor: "bg-orange-900/50 text-orange-300 border-orange-700/50"

  errorDisplay:
    position: "below"
    style:
      color: "text-red-400"
      fontSize: "text-xs"
      icon: "❌"

  warningDisplay:
    position: "below"
    style:
      color: "text-yellow-400"
      fontSize: "text-xs"
      icon: "⚠️"

# ============================================================================
# BUILDER SPECIFIC - Builder 탭 전용
# ============================================================================
builder:
  formLayout:
    container:
      className: "bg-gradient-to-br from-purple-950/50 to-zinc-900 border-2 border-purple-800/50 rounded-lg p-6"
    title:
      text: "Schema-Based Fields"
      icon: "📝"
    fieldContainer:
      className: "space-y-4"

  fieldRendering:
    standard:
      label:
        source: "description"
        fallback: "name"
        showRequired: true
        showType: true
      input:
        className: "bg-zinc-800 border-zinc-700"

    enum:
      component: "Select"
      dynamic: true
      triggerField: "TYPE"

    array:
      component: "Textarea"
      parseJson: true
      showHint: true

    object:
      accordion: true
      checkbox: true
      expandByDefault: false

  dynamicBehavior:
    conditionalVisibility:
      enabled: true
      autoDetect: true
      evaluateOn: "change"
      hideMode: "remove"

    dynamicEnum:
      enabled: true
      triggerField: "TYPE"
      preserveValue: false

    dynamicRequired:
      enabled: true
      triggerField: "TYPE"

  instanceManagement:
    enabled: true
    wrapper: "Assign"
    defaultInstance: "1"

  jsonPreview:
    enabled: true
    modes:
      - "annotated"
      - "monaco"
    defaultMode: "annotated"

# ============================================================================
# TABLE SPECIFIC - Table (Spec) 탭 전용
# ============================================================================
table:
  # 스키마 확장 필드 추출 규칙
  # ⚠️ 순수 UI 마커만 (shared.yaml SSOT 기준)
  # 검증 마커(x-enum-by-type, x-node-count-by-type, x-required-by-type)는 
  # allOf[].if.then으로 대체되어 제거됨
  schemaExtensions:
    extractFromSchema:
      - { key: "x-ui", targetProperty: "ui", transformKey: true }
      - { key: "x-enum-labels", targetProperty: "enumLabels", transformKey: true }
      - { key: "x-enum-labels-by-type", targetProperty: "enumLabelsByType", transformKey: true }
      - { key: "x-transport", targetProperty: "x-transport", passthrough: true }

  # 테이블 구조
  structure:
    columns:
      - { id: "no", header: "No.", width: "6%", align: "center" }
      - { id: "description", header: "Description", width: "35%", align: "left" }
      - { id: "key", header: "Key", width: "14%", align: "left" }
      - { id: "type", header: "Value Type", width: "10%", align: "center" }
      - { id: "default", header: "Default", width: "10%", align: "center" }
      - { id: "required", header: "Required", width: "25%", align: "left" }

    numbering:
      start: 1
      resetOnSection: false

  # 행 렌더링
  rowRendering:
    description:
      source: "x-ui.label"
      fallback: "key"
      markdown: true
      features:
        enum:
          enabled: true
          title: "**Enum Values:**"
          format: "• {value} - {label}"
        enumByType:
          enabled: true
          title: "**Enum Values by Type:**"
        valueConstraint:
          enabled: true
          title: "**Value Constraints:**"
          badge: "APP"
        nodeCountByType:
          enabled: true
          title: "**Node Count by Type:**"
          badge: "APP"
        valueHintsByType:  # 🔥 NEW: TYPE별 값 힌트 표시
          enabled: true
          title: "**💡 Value Hints by Type:**"
          style: "hint"  # 힌트 스타일 (amber 색상)

    key:
      format: "\"{key}\""
      style:
        color: "text-blue-400"
        fontFamily: "font-mono"

    required:
      dynamicByType: true
      simpleFormat: true  # 🔥 Enable badge-style Required/Optional indicators
      badge:
        required:
          className: "px-2 py-0.5 text-xs rounded bg-red-600/20 text-red-400"
          text: "Required"
        optional:
          className: "px-2 py-0.5 text-xs rounded bg-zinc-700/50 text-zinc-400"
          text: "Optional"
        conditional:
          className: "px-2 py-0.5 text-xs rounded bg-yellow-600/20 text-yellow-400"
          text: "Conditional"

  # 중첩 필드
  nestedFields:
    enabled: true
    expandable: true
    expandIcon: "▼"
    collapseIcon: "▶"
    style:
      indentation: "pl-8"
      background: "bg-zinc-900/50"
      keyColor: "text-amber-400"

# ============================================================================
# STYLING - 전역 스타일
# ============================================================================
styling:
  colors:
    primary: "blue-600"
    secondary: "cyan-600"
    success: "green-600"
    error: "red-600"
    warning: "amber-600"
    section: "cyan-400"

  spacing:
    fieldGap: "4"
    sectionGap: "6"

  borders:
    fieldBorder: "border-zinc-700"
    sectionBorder: "border-cyan-800/50"

# ============================================================================
# VALIDATION MESSAGES - 검증 메시지 템플릿
# ============================================================================
validationMessages:
  required: "{field} is required for {TYPE}"
  invalidType: "{field} must be a {type}"
  invalidEnum: "{field} must be one of: {values} (for {TYPE})"
  minItems: "{field} must have at least {min} items"
  maxItems: "{field} must have at most {max} items"
  nodeCount: "{field} must have {count} nodes for {TYPE}"
  valueConstraint: "{field}: {constraint}"

# ============================================================================
# FALLBACK UI - 폴백 렌더링 (missing x-ui 처리)
# ============================================================================
fallbackUI:
  # x-ui 없는 필드 처리
  missingXui:
    label:
      source: "key"
      transform: "humanize"  # "iTENDON_TYPE" → "I Tendon Type"
    # ⚠️ sectionId deprecated - using groupId instead
    component: "Input"
    warn: true

  # 알 수 없는 타입 처리
  unknownType:
    component: "Textarea"
    props:
      placeholder: "Enter value as JSON"
    warn: true

# NOTE: tableSchemaRegistry moved to shared.yaml for SSOT
# See: schema_definitions/civil_gen_definition/enhanced/shared.yaml → tableSchemaRegistry

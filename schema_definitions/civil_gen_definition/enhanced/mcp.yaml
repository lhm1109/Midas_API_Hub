# ============================================================================
# MCP RULES - MCP 서버 전용 규칙
# ============================================================================
# MCP 서버가 지켜야 할 보안, IO, 결정론, 검증 규칙
# 스키마 의미는 shared.yaml에서 참조
# ============================================================================

version: "1.0.0"
extends: "./shared.yaml"

# ============================================================================
# 🔥 SCHEMA PHILOSOPHY (핵심 원칙)
# ============================================================================
# - 검증 로직: 표준 JSON Schema 키워드 (allOf, if/then, required, enum)
# - UI 표현: x-* 마커 (삭제해도 검증 동작 동일)
# - AI 스키마 생성 시 이 원칙 준수 필수!
# ============================================================================

# ============================================================================
# SECURITY - 보안 정책
# ============================================================================
security:
  # 읽기 허용 경로
  readAllowlist:
    - "schema_definitions/**/*.{yaml,yml}"
    - "schema_definitions/**/*.json"
  
  # 쓰기 허용 경로
  writeAllowlist:
    - "generated_schemas/**/*.json"
  
  # 차단 정책
  deny:
    pathTraversal: true      # ../ 차단
    symlinks: true           # 심볼릭 링크 차단
    absolutePaths: true      # 절대 경로 차단 (allowlist 외)

# ============================================================================
# DETERMINISM - 결정론적 출력 보장
# ============================================================================
determinism:
  # JSON 출력 규칙
  json:
    sortObjectKeys: true     # 키 알파벳 정렬
    indent: 2
    lineEnding: "LF"         # CRLF | LF
  
  # 배열 처리
  array:
    preserveOrder: true      # 원본 순서 유지
  
  # 타입 강제 변환 금지
  forbidTypeCoercion: true   # "1" → 1 변환 금지
  
  # YAML Alias 처리
  yamlAliasPolicy: "expand"  # expand | preserve | reject

# ============================================================================
# VALIDATION PIPELINE - 검증 파이프라인
# ============================================================================
validation:
  # Enum 규칙
  enum:
    integerMustUseOneOf: true
    autoConvert:
      enabled: true
      from: "enum"
      to: "oneOf"
      fallbackLabel: "Option {value}"
  
  # 구조 검증
  structure:
    requireSchema: 
      enabled: true
      value: "http://json-schema.org/draft-07/schema#"
    recommendTitle:
      enabled: true
      level: "warning"
    requiredFieldsExist:
      enabled: true
      message: "required에 있는 필드가 properties에 없습니다"
  
  # 타입 검증
  type:
    prefixMatch:
      enabled: true
      # 규칙은 shared.yaml의 typeInferenceRegistry 참조

# ============================================================================
# TRANSFORM RULES - 변환 규칙
# ============================================================================
transform:
  # 루트 래퍼 키 제거
  unwrapRootKey:
    enabled: true
    extractTitle: true
    preserveMetadata:
      - "description"
      - "x-ui"
      # - "x-transport"  # 공식 미지원
  
  # Unknown key 처리
  unknownKeys:
    action: "passthrough"    # passthrough | remove | error
    collect: true            # meta에 기록
    
  # x-* 마커 처리
  markers:
    # shared.yaml의 markerRegistry 참조
    unknownMarker: "passthrough"  # passthrough | warn | error

# ============================================================================
# FIELD NAMING RULES - 필드 네이밍 규칙 (AI 스키마 생성용)
# ============================================================================
# 📌 AI가 스키마 생성 시 이 규칙을 참조하여 축약형 키 이름을 사용해야 함
fieldNaming:
  # 🔥 스타일 가이드
  style:
    case: "UPPER_SNAKE"       # UPPER_SNAKE | camelCase | PascalCase
    maxLength: 12             # 최대 12자 권장
    abbreviateCommonWords: true
    removeHungarianNotation: true  # i, b, d, s 접두사 제거
  
  # 🔥 접두사 규칙 (타입 추론용, 출력 키에서는 제거됨)
  # ⚠️ 이 접두사들은 타입 추론에만 사용되고, 최종 스키마에서는 제거됩니다
  prefixes:
    i: "integer"              # iTENDON_TYPE → TENDON_TYPE
    s: "string"               # sDESIGN_CODE → DESIGN_CD
    d: "number"               # dEXPOSURE_FACTOR → EXPOSURE
    b: "boolean"              # bUSE_LIMIT → USE_LIMIT
    n: "number"               # nVALUE → VALUE (legacy)
    arr: "array"              # arrNODE → NODE
  
  # 🔥 축약어 사전 (AI 생성 시 활용)
  abbreviations:
    # 공통 약어
    Construction: "CONSTR"
    Combination: "COMB"
    Combinations: "COMBS"
    Principal: "PRINC"
    Flexural: "FLEX"
    Strength: "STR"
    Service: "SVC"
    Factored: "FACT"
    Maximum: "MAX"
    Minimum: "MIN"
    Shear: "SHEAR"
    Torsion: "TORS"
    Combined: "COMB"
    Check: "CHK"
    Stress: "STRS"
    Prestressing: "PREST"
    Tendons: "TEND"
    Stage: "STG"
    Loads: "LD"
    Load: "LD"
    Value: "VAL"
    Factor: "FACT"
    Exposure: "EXP"
    Type: "TYPE"
    Class: "CLS"
    Code: "CODE"
    Design: "DES"
    Condition: "COND"
    Corrosive: "CORR"
    Relaxation: "RLX"
    Relieved: "RLV"
    Segmental: "SEG"
    Number: ""                # 생략 (NODE = Node No.)
    
  # 🔥 예시 매핑 (긴 이름 → 축약 이름)
  examples:
    # Output Parameters - Factored Loads
    - long: "bCombinedShearAndTorsionCheck"
      short: "bCOMB_SHEAR_TORS"
      label: "Combined Shear and Torsion Check"
      
    - long: "bFlexuralStrengthCheck"
      short: "bFLEX_STR_CHK"
      label: "Flexural Strength Check"
      
    - long: "bShearStrengthCheck"
      short: "bSHEAR_STR_CHK"
      label: "Shear Strength Check"
    
    # Output Parameters - Service Loads
    - long: "bStressByConstructionStage"
      short: "bSTRS_CONSTR"
      label: "Stress by Construction Stage"
      
    - long: "bStressByServiceLoadCombinations"
      short: "bSTRS_SVC_COMB"
      label: "Stress by Service Load Combinations"
      
    - long: "bStressInPrestressingTendons"
      short: "bSTRS_PREST"
      label: "Stress in Prestressing Tendons"
      
    - long: "bPrincipalStressByConstructionStage"
      short: "bPRINC_CONSTR"
      label: "Principal Stress by Construction Stage"
      
    - long: "bPrincipalStressByMaxShear"
      short: "bPRINC_MAX_SHEAR"
      label: "Principal Stress by Service Load (Max Shear)"
      
    - long: "bPrincipalStressByMaxTorsion"
      short: "bPRINC_MAX_TORS"
      label: "Principal Stress by Service Load (Max Torsion)"
    
    - long: "bCrackCheck"
      short: "bCRACK_CHK"
      label: "Crack Check"
    
    # Input Parameters
    - long: "iTendonType"
      short: "iTEND_TYPE"
      label: "Tendon Type"
      
    - long: "iCorrosiveCondition"
      short: "iCORR_COND"
      label: "Corrosive Condition"
      
    - long: "iFlexuralStrength"
      short: "iFLEX_STR"
      label: "Flexural Strength"
      
    - long: "iExposureFactor"
      short: "iEXP_FACT"
      label: "Exposure Factor for Crack Width"
      
    - long: "dExposureFactorValue"
      short: "dEXP_VAL"
      label: "User Exposure Factor Value"
      
    - long: "iConstructionType"
      short: "iCONSTR_TYPE"
      label: "Construction Type"
      
    - long: "sDesignCode"
      short: "sDES_CODE"
      label: "Design Code"

# ============================================================================
# OUTPUT - 출력 규칙
# ============================================================================
output:
  # 파일명 규칙
  filename:
    case: "UPPER_SNAKE"      # 대문자 스네이크 케이스
    extension: ".json"
  
  # 메타데이터 포함
  meta:
    enabled: true
    fields:
      - "rulesVersion"
      - "specVersion"
      - "sourceHash"
      - "outputHash"
      - "generatedAt"
      - "appliedRuleIds"
      - "warnings"
      - "unknownKeys"
  
  # 별도 meta.json 파일 생성
  separateMetaFile: false    # true면 SCHEMA_NAME.meta.json 생성

# ============================================================================
# TOOL CONTRACT - MCP 도구 계약
# ============================================================================
toolContract:
  # save_schema 도구
  saveSchema:
    requiredParams:
      - schemaName
      - schema
    optionalParams:
      - description
      - outputDir
      - questions
      - skipValidation
    
    # 질문 필드 정책
    questions:
      maxItems: 10
      requiredFields:
        - field
        - question
      optionalFields:
        - context
        - suggestion

# ============================================================================
# AUTO-QUESTION PATTERNS - 자동 질문 패턴 (AI 참조용)
# ============================================================================
# 📌 AI가 스키마 생성 시 아래 패턴을 감지하면 사용자에게 질문해야 함
autoQuestionPatterns:
  # 🔥 조건부 입력 필드 패턴
  conditionalInput:
    description: |
      라디오/드롭다운 옵션 중 "User", "Custom", "직접 입력" 등의 옵션이 있으면
      해당 옵션 선택 시 텍스트/숫자 입력 필드가 활성화되는지 질문해야 함
    triggers:
      - "User"
      - "Custom"
      - "Manual"
      - "직접 입력"
      - "사용자 정의"
    question: |
      "{option}" 옵션을 선택하면 별도의 입력 필드가 활성화되나요?
      (예: 숫자 입력, 텍스트 입력)
    # 🔥 NEW: 표준 JSON Schema 방식 (검증 로직)
    schemaPattern: |
      allOf:
        - if:
            properties:
              {parentField}:
                const: {optionValue}
          then:
            required:
              - {inputField}
    # 🔥 조건부 표시 (x-optional-when 사용)
    optionalWhenPattern: |
      x-optional-when:
        {parentField}: {optionValue}
  
  # 🔥 TYPE별 조건부 필드 패턴
  typeConditionalFields:
    description: |
      TYPE 선택에 따라 보이는/숨겨지는 필드가 있는지 확인
    question: |
      "{field}" 필드는 특정 TYPE에서만 사용 가능한가요?
      어떤 TYPE에서 사용 가능한지 알려주세요.
    # 🔥 NEW: 표준 JSON Schema 방식 (검증 로직)
    schemaPattern: |
      allOf:
        - if:
            properties:
              TYPE:
                const: "TYPE1"
          then:
            required:
              - {field}
            properties:
              {field}:
                enum: [...]
    # 🔥 조건부 표시 + 라벨 (x-optional-when 사용)
    optionalWhenPattern: |
      x-optional-when:
        TYPE: "TYPE1"
      x-enum-labels-by-type:
        TYPE1:
          "1": "Option A"
          "2": "Option B"
  
  # 🔥 그룹/섹션 토글 패턴
  groupToggle:
    description: |
      특정 옵션 선택 시 전체 그룹/섹션이 활성화되는 경우
    triggers:
      - "Enable"
      - "Use"
      - "활성화"
      - "사용"
    question: |
      "{option}" 옵션을 선택하면 추가 설정 영역이 활성화되나요?
      어떤 필드들이 활성화되는지 알려주세요.
  
  # 🔥 기본값 연동 패턴
  linkedDefaults:
    description: |
      한 필드의 선택이 다른 필드의 기본값에 영향을 주는 경우
    question: |
      "{field1}" 선택에 따라 "{field2}"의 기본값이 변경되나요?
      
  # 🔥 Select All / Unselect All 패턴
  bulkSelection:
    description: |
      "Select All", "Unselect All" 버튼이 있는 체크박스 그룹
    triggers:
      - "Select All"
      - "Unselect All"
      - "모두 선택"
      - "모두 해제"
    question: |
      이 체크박스 그룹에 "모두 선택/해제" 기능이 필요한가요?
    note: |
      이 기능은 스키마가 아닌 UI 렌더러에서 처리됨

# ============================================================================
# EXAMPLE QUESTIONS - 질문 예시 (AI 참조용)
# ============================================================================
exampleQuestions:
  - field: "iEXP_FACT"
    question: |
      "Exposure Factor for Crack Width"에서 "User" 옵션을 선택하면 
      별도의 숫자 입력 필드가 활성화되나요? 있다면 기본값은 무엇인가요?
    context: "이미지에서 'User' 옵션 옆에 입력 필드가 보입니다"
    # 🔥 NEW: 표준 JSON Schema 방식 권장
    suggestion:
      addField: "dEXP_VAL"
      type: "number"
      default: 1
      # 검증 로직 (allOf if/then)
      allOfPattern: |
        allOf:
          - if:
              properties:
                iEXP_FACT:
                  const: 2
            then:
              required:
                - dEXP_VAL
      # 조건부 표시 (x-optional-when 사용)
      optionalWhenPattern: |
        x-optional-when:
          iEXP_FACT: 2
        
  - field: "STYPE"
    question: |
      \"Element Subtype\"은 모든 TYPE에서 사용 가능한가요?
      아니면 특정 TYPE에서만 보이나요?
    context: "allOf if/then으로 조건부 enum 정의 필요"
    # 🔥 NEW: 표준 JSON Schema 방식 권장
    suggestion:
      usePattern: "allOf if/then + x-enum-labels-by-type"
      example: |
        allOf:
          - if:
              properties:
                TYPE:
                  const: "TENSTR"
            then:
              properties:
                STYPE:
                  enum: [1, 2, 3]
        # UI 라벨 (검증과 무관)
        x-enum-labels-by-type:
          TENSTR:
            "1": "Truss Type"
            "2": "Hook Type"
            "3": "Cable Type"

# ============================================================================
# 🔥 AI PROMPTS - MCP 프롬프트 규칙 (SSOT)
# ============================================================================
# AI가 prompts/get을 호출하면 이 섹션의 내용이 반환됨
# 모든 스키마 생성 규칙은 여기에 정의 (TypeScript에 중복 금지)
# ============================================================================
aiPrompts:
  schema_rules:
    name: "schema_rules"
    description: "스키마 생성 시 따라야 할 규칙 조회"
    
    # 섹션별 규칙 정의
    sections:
      table_schema: |
        【Table Schema 생성 규칙】
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        🚨 CRITICAL: 테이블 관련 스키마는 MUST USE generateTableSchema: true
        
        ✅ 다음 경우 generateTableSchema: true 필수:
          • 제목에 "Table", "Check", "Result" 포함
          • 다이얼로그에 "Records", "Activation", "Filter" 포함
          • COMPONENTS, UNIT, TABLE_TYPE 필드가 예상되는 경우
          • Construction Stage, Stress, Force, Displacement 등 결과 테이블
        
        🔥 필수 파라미터 조합:
          {
            "generateTableSchema": true,
            "wrapWithSimpleObject": true,
            "tableTypeEnums": ["STRESSCS", "BEAMFORCE", ...],
            "componentEnums": ["Elem", "Part", "FT", "FB", ...],
            "componentEnumLabelsByType": {
              "STRESSCS": {
                "FT": "Stress at Top",
                "FB": "Stress at Bottom"
              }
            },
            "additionalTableFields": ["NODE_ELEMS", "LOAD_CASE_NAMES", "OPT_CS"]
          }
        
        📋 generateTableSchema가 자동 추가하는 필드:
          • TABLE_NAME: Response Table Title
          • TABLE_TYPE: Result Table Type (enum)
          • EXPORT_PATH: Result Table Save Path
          • UNIT: {FORCE, DIST, HEAT, TEMP}
          • STYLES: {FORMAT, PLACE}
          • COMPONENTS: 테이블 컴포넌트 배열 (enum)
        
        ⚠️ 주의사항:
          • generateTableSchema 없이 생성하면 위 필드들이 모두 누락됨
          • 테이블 다이얼로그도 generateTableSchema 필요
          • wrapWithSimpleObject는 항상 함께 사용
        
        🚨 CRITICAL: COMPONENTS enum 자동 추출 필수
          • 사용자가 테이블 이미지를 제공하면 YOU MUST:
            1. 이미지에서 테이블 헤더(컬럼명) 모두 읽기
            2. componentEnums 파라미터에 제공
            3. componentEnumLabelsByType에 각 컬럼의 의미 설명 추가
            4. ⚠️ **단위는 라벨에 포함하지 말 것** (예: "(N/mm²)", "(kN)" 등 제거)
          
          • 예시 (Stress Table):
            "componentEnums": [
              "Elem", "Part", "Girder/Slab", "Comp./Tens.", 
              "Stage", "CHK", "FT", "FB", "FTL", "FBL", 
              "FTR", "FBR", "FMAX", "ALW"
            ]
            "componentEnumLabelsByType": {
              "STRESSCS": {
                "Elem": "Element Number",
                "Part": "Part Number",
                "FT": "Stress at Top",
                "FB": "Stress at Bottom",
                "FTL": "Stress at Top Left",
                "FBL": "Stress at Bottom Left",
                "FTR": "Stress at Top Right",
                "FBR": "Stress at Bottom Right",
                "FMAX": "Maximum Stress",
                "ALW": "Allowable Stress",
                "CHK": "Check Result"
              }
            }
          
          • componentEnums를 제공하지 않으면 COMPONENTS 필드가 빈 enum으로 생성됨!
      
      conditional: |
        【조건부 필드 마커 규칙】
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        ✅ 허용된 마커:
          • x-required-when: 조건 만족 시 필수 + 표시
          • x-optional-when: 조건 만족 시 선택 + 표시
        
        ❌ 금지된 패턴 (자동 변환됨):
          • x-uiRules.visibleWhen → x-optional-when
          • x-ui.visibleWhen → x-optional-when
        
        📋 객체 형식 (단일 조건):
          "WALL_ID": {
            "x-optional-when": { "TYPE": "WALL" }
          }
        
        📋 복합 조건 (AND):
          "CABLE": {
            "x-optional-when": { "TYPE": "TENSTR", "STYPE": 3 }
          }
        
        📋 🔥 배열 형식 (여러 조건 + 힌트):
          "TENS": {
            "x-optional-when": [
              { 
                "condition": { "TYPE": "TENSTR" }, 
                "hint": "음수 입력 권장 (allowable compression)" 
              },
              { 
                "condition": { "TYPE": "COMPTR" }, 
                "hint": "양수 입력 권장 (allowable tension)" 
              }
            ]
          }
        
        🔥 배열 형식 장점:
          • 조건별 힌트를 직접 포함 가능
          • 조건별 다른 그룹ID도 설정 가능
          • 같은 필드가 여러 조건에서 다르게 표시

      ui: |
        【UI 마커 규칙】
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        x-ui 객체 구조:
          {
            "label": "필드 라벨",          // 필수
            "groupId": "그룹 ID",          // 선택
            "order": 10,                   // 선택
            "placeholder": "힌트 텍스트"   // 선택
          }
        

        
        x-ui 외부 마커:
          • x-enum-labels-by-type: TABLE_TYPE별 enum 라벨

      validation: |
        【검증 로직 규칙】
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        핵심 원칙: 검증 로직은 표준 JSON Schema 키워드 사용
        
        조건부 필수 필드 (allOf if/then):
          "allOf": [
            {
              "if": { "properties": { "TYPE": { "const": "WALL" } } },
              "then": { "required": ["WALL_ID", "W_CON"] }
            }
          ]
        
        정수 enum → oneOf 변환 (자동):
          ❌ "enum": [1, 2, 3]
          ✅ "oneOf": [
               { "const": 1, "title": "Option A" },
               { "const": 2, "title": "Option B" }
             ]

      questions: |
        【질문(questions) 규칙】
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        다음 상황에서는 반드시 questions 배열에 질문 추가:
        
        1. 필드 타입/enum 값이 불확실한 경우
        2. 조건부 로직이 복잡하거나 불명확한 경우
        3. 기본값이 확실하지 않은 경우
        4. 필드 간 관계가 이미지에서 명확하지 않은 경우
        
        질문 형식:
          {
            "field": "필드명",
            "question": "질문 내용",
            "context": "상황 설명 (선택)",
            "suggestion": { "type": "integer", "default": 0 }
          }

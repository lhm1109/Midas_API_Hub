# ============================================================================
# SHARED RULES - 공통 의미 규칙의 단일 진실 원천(SSOT)
# ============================================================================
# 이 파일은 MCP와 UI가 공통으로 참조하는 규칙입니다.
# 중복을 방지하고 일관성을 유지하기 위해 이 파일만 수정하세요.
#
# ⚠️ SSOT 원칙 (v1.1 - 결정론 강화):
#   - 버전: versioning 섹션만 책임
#   - 섹션/그룹: schemaLogic.sectionRules만 책임
#   - 래퍼: wrapperRegistry만 책임 (priority 없으면 defaultHandlers.wrapperPriorityDefault 적용)
#   - 컴포넌트: componentRegistry만 책임
#   - 마커: markerRegistry.id가 SSOT
#     → 트리거 문자열은 런타임에서 "has-marker:<MARKER_ID>" 자동 생성
#     → triggerId 필드 없음 (중복 제거)
#   - 조건: 구조화된 condition 객체 사용 (문자열 하드코딩 금지)
#     → 예: { type: "has-marker", markerId: "MARKER_ENUM_BY_TYPE" }
#
# ⚠️ 검증 경계:
#   - shared.yaml 검증 → shared.meta.schema.json (CI)
#   - 입력 스키마 검증 → unknownPolicy (런타임)
#
# ⚠️ 메타스키마: shared.meta.schema.json
# ============================================================================

# ============================================================================
# VERSIONING - 버전 관리 (유일한 버전 SSOT)
# ============================================================================
versioning:
  rulesSpecVersion: "1.5.0"  # 🔥 SSOT 100점: integrityRules + x-ui.sectionId
  inputSpec:
    schemaDraft: "draft-07"
    min: "1.0"
    max: "1.x"

# ============================================================================
# UNKNOWN POLICY - 입력 스키마 unknown 키 처리 (런타임용)
# ============================================================================
# ⚠️ 이 정책은 Enhanced JSON Schema 파싱 시 적용됨
#    shared.yaml 자체의 unknown 키는 meta-schema가 검증
unknownPolicy:
  transform:
    action: "passthrough"
    collectUnknown: true
  validate:
    unknownKey: "warn"
    unknownMarker: "warn"
    unsupportedStructure: "error"

# ============================================================================
# DEFAULT HANDLERS
# ============================================================================
defaultHandlers:
  typeInferenceFallback:
    type: "string"
    warn: true
  
  missingXui:
    label: "{key}"
    warn: true
  
  # 🔥 wrapperRegistry priority 없을 때 적용되는 기본값
  # 런타임에서 반드시 이 값을 사용해야 결정론 보장
  wrapperPriorityDefault: 0

# ============================================================================
# PRECEDENCE - 규칙 우선순위 정의 (결정론 보장)
# ============================================================================
# ⚠️ 적용 범위: 모든 룰 세트 (wrapperRegistry, markerRegistry, sectionRules 등)
# ⚠️ Merge 전략:
#   - 동일 키 → 상위 우선순위가 override (deep merge 아님)
#   - 리스트 → 상위 우선순위가 전체 대체 (concat 아님)
#   - 없는 키 → 하위 우선순위에서 상속
precedence:
  order:
    - explicit    # 스키마 내부 x-schema-rules (최우선)
    - product     # 제품별 ui.yaml, mcp.yaml
    - module      # 모듈별 override (향후)
    - shared      # 공통 shared.yaml
    - inference   # 타입 추론 기본값
  merge:
    sameKey: "override"      # 동일 키 → 상위가 덮어씀
    list: "replace"          # 리스트 → 전체 대체
    missingKey: "inherit"    # 없는 키 → 하위에서 상속

# ============================================================================
# INTEGRITY RULES - 레퍼런스 무결성 (SSOT)
# ============================================================================
# ⚠️ 이 규칙으로 참조 존재 여부를 런타임/CI에서 검증
integrityRules:
  # markerId는 반드시 markerRegistry.id에 존재해야 함
  requireMarkerIdInRegistry: true
  # condition.type은 반드시 conditionRegistry.type에 존재해야 함
  requireConditionTypeInRegistry: true
  # 🆕 x-ui.groupId는 반드시 ui.yaml의 groups에 존재해야 함 (optional validation)
  requireGroupIdInUiGroups: false  # Set to true when ui.yaml groups validation is implemented

# ============================================================================
# REGISTRIES
# ============================================================================

# ============================================================================
# MARKER REGISTRY - 순수 UI 마커만 등록 (pureUI: true)
# ============================================================================
# ⚠️ 핵심 원칙: "x-* 제거해도 검증 동작 100% 동일"
#   - 검증 로직 → 표준 JSON Schema 키워드 (allOf if/then/required/enum)
#   - UI 표현 → x-* 마커 (삭제 가능)
#
# ⚠️ 과거 검증 로직 마커 (더 이상 사용 금지):
#   - x-required-by-type → allOf[].if.then.required 사용
#   - x-enum-by-type → allOf[].if.then.properties.*.enum 사용
#   - x-node-count-by-type → allOf[].if.then.properties.NODE.minItems/maxItems 사용
#
# ⚠️ 조건부 UI 표시 마커 (순수 UI용, 검증과 무관):
#   - x-required-when: 조건 만족 시 UI에서 필수로 표시
#   - x-optional-when: 조건 만족 시 UI에서 선택적으로 표시
# ============================================================================
markerRegistry:
  # ────────────────────────────────────────────────────────────────────────────
  # UI 메타데이터 (label, groupId, hint)
  # ────────────────────────────────────────────────────────────────────────────
  - id: MARKER_UI
    key: "x-ui"
    description: "UI 메타데이터 (label, groupId, hint)"
    pureUI: true  # 삭제해도 검증 영향 없음
    schema:
      type: object
      properties:
        label: { type: string, description: "Field label (for UI display)" }
        groupId: { type: string, description: "Group ID (refers to x-ui.groups defined at object level)" }
        hint: { type: string, description: "Hint text" }
        groups: { type: array, description: "Group definitions (defined at object level)" }
        component: { type: string, description: "UI component type (e.g., RadioGroup)" }

  # ────────────────────────────────────────────────────────────────────────────
  # 전송 메타데이터 (API 정보)
  # ────────────────────────────────────────────────────────────────────────────
  - id: MARKER_TRANSPORT
    key: "x-transport"
    description: "Transport 정보 (uri, method, bodyRoot)"
    pureUI: true


  # ────────────────────────────────────────────────────────────────────────────
  # TYPE별 Enum 라벨 (검증 X, UI 표시용 라벨만)
  # ⚠️ 실제 enum 값은 allOf[].if.then에서 정의
  # ────────────────────────────────────────────────────────────────────────────
  - id: MARKER_ENUM_LABELS_BY_TYPE
    key: "x-enum-labels-by-type"
    description: "TYPE별 enum 라벨 (UI 표시용, 검증 무관)"
    pureUI: true
    example: |
      x-enum-labels-by-type:
        TENSTR:
          "1": "Truss"
          "2": "Hook"
          "3": "Cable"
        COMPTR:
          "1": "Truss"
          "2": "Gap"

  # ────────────────────────────────────────────────────────────────────────────
  # Simple Enum 라벨 (단순 배열 형식)
  # ────────────────────────────────────────────────────────────────────────────
  - id: MARKER_ENUM_LABELS
    key: "x-enum-labels"
    description: "Enum 라벨 배열 (UI 표시용, 검증 무관). enum 값과 순서 일치"
    pureUI: true
    schema:
      type: array
      items:
        type: string
    example: |
      enum: [0, 1, 2, 3, 4]
      x-enum-labels: ["3-D", "X-Z Plane", "Y-Z Plane", "X-Y Plane", "Constraint RZ"]


  # ────────────────────────────────────────────────────────────────────────────
  # 조건부 필드 표시 (UI 전용 - 검증과 무관)
  # ────────────────────────────────────────────────────────────────────────────
  - id: MARKER_REQUIRED_WHEN
    key: "x-required-when"
    description: "조건 만족 시 UI에서 필수로 표시 (검증은 allOf if/then 사용)"
    pureUI: true
    schema:
      oneOf:
        - type: object
          description: "단일 조건"
        - type: array
          items:
            type: object
            properties:
              condition: { type: object }
              hint: { type: string }
    example: |
      # 객체 형식 (단일 조건)
      x-required-when: { "bSELFWT": true }
      
      # 배열 형식 (여러 조건 + 힌트)
      x-required-when:
        - condition: { "TYPE": "WALL" }
          hint: "벽체 타입에서 필수"

  - id: MARKER_OPTIONAL_WHEN
    key: "x-optional-when"
    description: "조건 만족 시 UI에서 선택적으로 표시 (검증과 무관)"
    pureUI: true
    schema:
      oneOf:
        - type: object
          description: "단일 조건"
        - type: array
          items:
            type: object
            properties:
              condition: { type: object }
              hint: { type: string }
    example: |
      # 객체 형식 (단일 조건)
      x-optional-when: { "TYPE": "WALL" }
      
      # 배열 형식 (여러 조건 + 힌트)
      x-optional-when:
        - condition: { "TYPE": "TENSTR" }
          hint: "음수 입력 권장"
        - condition: { "TYPE": "COMPTR" }
          hint: "양수 입력 권장"


# ============================================================================
# CONDITION REGISTRY - condition type taxonomy (전역 SSOT)
# ============================================================================
# ⚠️ 모든 condition.type은 여기 등록된 것만 유효 (schemaLogic/mcp/ui 공통)
# ⚠️ 런타임은 이 레지스트리를 기준으로 검증
conditionRegistry:
  - type: "has-marker"
    requiredParams: ["markerId"]
    description: "markerRegistry.id 참조, 해당 마커 존재 시 true"

  - type: "has-enum"
    requiredParams: []
    description: "명시적 enum 배열 존재 시 true"

  - type: "has-oneOf-with-const"
    requiredParams: []
    description: "oneOf 내부에 const 속성 존재 시 true"

  - type: "has-minItems"
    requiredParams: []
    description: "minItems 속성 존재 시 true"

  - type: "has-maxItems"
    requiredParams: []
    description: "maxItems 속성 존재 시 true"

  - type: "has-type"
    requiredParams: []
    description: "type 속성 존재 시 true"

  - type: "has-explicit-groupId"
    requiredParams: []
    description: "x-ui.groupId is explicitly present (true if defined)"

  - type: "always"
    requiredParams: []
    description: "항상 true (기본 fallback)"

  - type: "no-conditional-marker"
    requiredParams: []
    description: "x-required-when/x-optional-when이 없으면 true"

  - type: "has-field-condition"
    requiredParams: ["field"]
    description: "특정 필드 조건 존재 시 true"

  - type: "has-other-conditions"
    requiredParams: []
    description: "기타 조건 존재 시 true"

# ============================================================================
# GROUP SYSTEM - Inline group definitions (NOT centralized)
# ============================================================================
# ⚠️ Groups are defined inline within each schema using x-ui.groups
# ⚠️ sectionRegistry is DEPRECATED - use groupId instead
#
# Example:
#   x-ui:
#     groups:
#       - { id: "COMMON", title: "Common Keys" }
#       - { id: "TENSTR", title: "Tension Only" }
#   properties:
#     TYPE:
#       x-ui: { groupId: "COMMON" }

# 2. Wrapper Rules 레지스트리 (SSOT)
# ⚠️ 매칭 알고리즘 (결정론 보장):
#   1. priority DESC 정렬 (없으면 defaultHandlers.wrapperPriorityDefault 적용)
#   2. 동률이면 리스트 순서 유지 (stable sort 필수)
#   3. 첫 매칭 rule 반환 (short-circuit)

# 🔥 v1.4: 정책을 YAML로 선언 (SSOT)
wrapperRegistryPolicy:
  sort: "priorityDescStable"   # priority DESC + stable sort
  match: "first"               # 첫 매칭 반환

wrapperRegistry:
  - id: WRAP_DB
    pattern: "^/db/"
    wrapper: "Assign"
    priority: 10

  - id: WRAP_POST
    pattern: "^/post/"
    wrapper: "Argument"
    priority: 10

  - id: WRAP_DOC
    pattern: "^/doc/"
    wrapper: "Argument"
    priority: 10

  - id: WRAP_DESIGN
    pattern: "^/design/"
    wrapper: "Assign"
    priority: 10
    description: "Design DB APIs use Assign wrapper"

  - id: WRAP_DEFAULT
    pattern: ".*"
    wrapper: null
    priority: -1

# 3. 타입 접두사 추론 레지스트리
typeInferenceRegistry:
  - id: TYPE_INT
    prefix: "i"
    type: "integer"
    example: "iTENDON_TYPE"

  - id: TYPE_BOOL
    prefix: "b"
    type: "boolean"
    example: "bCRACK_CHECK"

  - id: TYPE_NUM
    prefix: "d"
    type: "number"
    example: "dEXPOSURE_VALUE"

  - id: TYPE_STR
    prefix: "s"
    type: "string"
    example: "sCODE_NAME"

# 4. 필드 타입 → UI 컴포넌트 레지스트리 (SSOT)
componentRegistry:
  string:
    component: "Input"
    props: { type: "text" }

  number:
    component: "Input"
    props: { type: "number" }

  integer:
    component: "Input"
    props: { type: "number" }

  boolean:
    component: "Checkbox"
    props: {}

  array:
    component: "Textarea"
    props: { placeholder: "Enter as JSON array, e.g., [1, 2, 3]" }

  object:
    component: "Textarea"
    props: { placeholder: "Enter as JSON object" }

  enum:
    component: "Select"
    props: {}

# ============================================================================
# NAMING POLICY
# ============================================================================
naming:
  yamlKeyPolicy:
    min: 3
    max: 20
    style: "camelCase"
  
  fieldNamePolicy:
    # 🔥 v1.4: 파생 규칙을 YAML로 선언 (SSOT)
    prefixSource: "typeInferenceRegistry"  # allowedPrefixes = typeInferenceRegistry.map(prefix)
    allowUppercase: true
    maxLength: 30
  
  conflict:
    strategy: "suffix"
    format: "{key}_{n}"

# ============================================================================
# OUTPUT META - 출력 메타데이터 템플릿
# ============================================================================
# ⚠️ source 경로 규칙:
#   - versioning.* : shared.yaml에서 직접 읽음
#   - _computed.*  : 런타임에서 계산 (sourceHash, outputHash 등)
# ⚠️ 에러 정책:
#   - required: true → 해석 실패 시 에러 (프로세스 중단)
#   - required: false + onMissing: warn → 경고 + null
#   - required: false + onMissing: null → 조용히 null
outputMeta:
  # 기본 에러 정책 (개별 필드에서 override 가능)
  defaults:
    required: false
    onMissing: "warn"  # "warn" | "error" | "null"
  fields:
    - alias: "rulesSpecVersion"
      source: "versioning.rulesSpecVersion"
      required: true  # 필수 - 없으면 에러
    - alias: "sourceHash"
      source: "_computed.sourceHash"
    - alias: "outputHash"
      source: "_computed.outputHash"
    - alias: "generatedAt"
      source: "_computed.generatedAt"
      required: true  # 필수
    - alias: "appliedRuleIds"
      source: "_computed.appliedRuleIds"
    - alias: "warnings"
      source: "_computed.warnings"
      onMissing: "null"  # 경고 없이 null
    - alias: "unknownKeys"
      source: "_computed.unknownKeys"
      onMissing: "null"  # 경고 없이 null

# ============================================================================
# DIAGNOSTICS - 진단 코드 체계
# ============================================================================
diagnostics:
  errors:
    - code: "ENUM_INVALID_FORMAT"
      level: "error"
      message: "정수 enum은 oneOf 형식 필수"
      fix: "auto-convert"

    - code: "PREFIX_TYPE_MISMATCH"
      level: "error"
      message: "접두사와 타입 불일치: {field}는 {expected} 타입이어야 함"

    - code: "UNSUPPORTED_STRUCTURE"
      level: "error"
      message: "지원하지 않는 스키마 구조: {structure}"

    - code: "INVALID_FIELD_NAME_POLICY"
      level: "error"
      message: "필드명 정책 위반: {field}"

    - code: "INVALID_YAML_KEY_POLICY"
      level: "error"
      message: "YAML 키 정책 위반: {key}"

    - code: "OUTPUT_META_SOURCE_NOT_FOUND"
      level: "error"
      message: "outputMeta source 경로 해석 실패: {source}"

  warnings:
    - code: "MISSING_XUI_LABEL"
      level: "warn"
      message: "x-ui.label 누락: {field}"
      fix: "generate-from-key"

    - code: "MISSING_XUI_GROUP"
      level: "warn"
      message: "x-ui.group 누락: {field}"

    - code: "UNKNOWN_KEY"
      level: "warn"
      message: "알 수 없는 키: {key}"

    - code: "UNKNOWN_MARKER"
      level: "warn"
      message: "알 수 없는 마커: {marker}"

# ============================================================================
# SCHEMA LOGIC - 스키마 처리 로직 (네임스페이스)
# ============================================================================
schemaLogic:
  schemaStructurePatterns:
    # 🔥 Pattern 1a: Assign + additionalProperties
    # 이 패턴은 Map 기반 엔티티 컬렉션을 처리
    - name: "Unwrap Wrapper with AdditionalProperties"
      description: "Assign/Argument 래퍼의 additionalProperties에서 엔티티 스키마 추출"
      enabled: true
      priority: 0  # 가장 먼저 체크
      detect:
        - path: "type"
          value: "object"
        - path: "properties.Assign.additionalProperties"
          exists: true
        - path: "properties.Assign.additionalProperties.type"
          value: "object"
      transform:
        action: "unwrap-wrapper-with-additionalProperties"
        
    # 🔥 Pattern 1b: Argument + additionalProperties
    - name: "Unwrap Argument Wrapper with AdditionalProperties"
      description: "Argument 래퍼의 additionalProperties에서 엔티티 스키마 추출"
      enabled: true
      priority: 0
      detect:
        - path: "type"
          value: "object"
        - path: "properties.Argument.additionalProperties"
          exists: true
        - path: "properties.Argument.additionalProperties.type"
          value: "object"
      transform:
        action: "unwrap-wrapper-with-additionalProperties"

    # 🔥 Pattern 1c: Assign + patternProperties (NEW)
    # patternProperties["^[0-9]+$"] 패턴을 사용하는 스키마 지원
    - name: "Unwrap Assign Wrapper with PatternProperties"
      description: "Assign 래퍼의 patternProperties에서 엔티티 스키마 추출"
      enabled: true
      priority: 0
      detect:
        - path: "type"
          value: "object"
        - path: "properties.Assign.patternProperties"
          exists: true
      transform:
        action: "unwrap-wrapper-with-additionalProperties"

    # 🔥 Pattern 1d: Argument + patternProperties (NEW)
    - name: "Unwrap Argument Wrapper with PatternProperties"
      description: "Argument 래퍼의 patternProperties에서 엔티티 스키마 추출"
      enabled: true
      priority: 0
      detect:
        - path: "type"
          value: "object"
        - path: "properties.Argument.patternProperties"
          exists: true
      transform:
        action: "unwrap-wrapper-with-additionalProperties"

    # 🔥 Pattern 1e: Argument with direct properties (Table API)
    # wrapWithSimpleObject로 생성된 Table 스키마 패턴
    # additionalProperties가 false이거나 없는 경우 (Map 패턴이 아닌 경우)
    - name: "Unwrap Argument Wrapper with Properties"
      description: "Argument 래퍼의 properties에서 Table 스키마 추출 (Map 패턴 아님)"
      enabled: true
      priority: 0
      detect:
        - path: "type"
          value: "object"
        - path: "properties.Argument.type"
          value: "object"
        - path: "properties.Argument.properties"
          exists: true
        # additionalProperties가 object 타입이 아닌지 확인 (false 또는 없음)
        - path: "properties.Argument.additionalProperties.type"
          exists: false
        # patternProperties가 없는지 확인
        - path: "properties.Argument.patternProperties"
          exists: false
      transform:
        action: "unwrap-wrapper-with-additionalProperties"

    # Pattern 2: 기존 unwrap-root-key (레거시)
    - name: "Unwrap Root Wrapper Key"
      description: "루트 래퍼 키를 제거하고 내부 스키마를 끌어올림"
      enabled: true
      priority: 1
      detect:
        - path: "$schema"
          exists: false
        - path: "type"
          exists: false
      transform:
        action: "unwrap-root-key"
        extractTitle: true
        preserveMetadata: ["description", "x-ui", "x-transport"]

  platformSkeleton:
    entityCollection:
      description: "Platform Standard Collection Map"
      type: "object"
      patternProperties:
        pattern: "^[0-9]+$"
        description: "Entity ID (numeric)"
        ref: "#/$defs/entity"
      additionalProperties: false
      minProperties: 0
    defaultBodyRoot: "Assign"
    alternativeBodyRoots:
      - "Argument"
      - "Assign"
    rootStructure:
      type: "object"
      additionalProperties: false

  # ⚠️ NOTE: sectionRules deprecated - using x-ui.groupId instead
  # sectionRegistry does not exist, so sectionId is not used
  sectionRules: []
  sectionOrder: []

  typeLabels: {}

  # Enum 판정 규칙
  # ⚠️ 구조화된 condition 사용 (문자열 하드코딩 금지)
  #    markerRegistry.id를 직접 참조
  enumDetectionRules:
    - id: ENUM_EXPLICIT
      condition:
        type: "has-enum"
      description: "명시적 enum 배열이 있으면 enum"

    - id: ENUM_ONEOF_CONST
      condition:
        type: "has-oneOf-with-const"
      description: "oneOf 내부에 const가 있으면 enum"

    # ⚠️ NOTE: MARKER_ENUM_BY_TYPE removed - not defined in markerRegistry
    # Use MARKER_ENUM_LABELS_BY_TYPE if needed for type-specific enum labels

  visibilityRules:
    - name: "No Conditional Marker"
      description: "x-required-when/x-optional-when이 없으면 항상 표시"
      condition:
        type: "no-conditional-marker"
      result: true
    - name: "TYPE Condition"
      description: "TYPE 필드 조건 확인"
      condition:
        type: "has-field-condition"
        field: "TYPE"
      evaluation:
        operator: "in"
        field: "TYPE"
    - name: "Other Field Conditions"
      description: "다른 필드 조건 확인"
      condition:
        type: "has-other-conditions"
      evaluation:
        operator: "all-match"

  requiredCalculationRules:
    priority:
      - "base-required"
      - "conditional-required"
      - "visibility-check"
    baseRequired:
      description: "최상위 required 배열에 있으면 모든 TYPE에서 required"
      status: "required"
    conditionalRequired:
      description: "allOf 조건에 매칭되면 해당 TYPE에서 required"
      status: "required"
    notVisible:
      description: "조건부 마커(x-required-when/x-optional-when) 조건으로 보이지 않으면 n/a"
      status: "n/a"
    default:
      description: "기본값"
      status: "optional"

  # 검증 레이어 결정 규칙
  # ⚠️ 구조화된 condition 사용
  validationLayerRules:
    STD:
      description: "Standard JSON Schema validation"
      triggers:
        - condition:
            type: "has-enum"
        - condition:
            type: "has-minItems"
        - condition:
            type: "has-maxItems"
        - condition:
            type: "has-type"
    # ⚠️ NOTE: APP validation triggers removed
    # MARKER_ENUM_BY_TYPE, MARKER_NODE_COUNT, MARKER_VALUE_CONSTRAINT not defined in markerRegistry

  descriptionBuildingRules:
    order:
      - label
      - enum-values
      - enum-by-type
      - value-constraints
      - node-count-by-type
      - hint
    templates:
      label: "<strong>{label}</strong>"
      enum-values:
        header: "<strong>Enum Values:</strong>"
        item: "<li><code>{value}</code> - {label}</li>"
        wrapper: "<ul>{items}</ul>"
      enum-by-type:
        header: "<strong>Enum Values by Type:</strong>"
        type-header: "<p><em>{type}:</em></p>"
        item: "<li><code>{value}</code> - {label}</li>"
        wrapper: "<ul>{items}</ul>"
      value-constraints:
        header: "<strong>Value Constraints:</strong>"
        item: "<li><em>{type}:</em> {constraint}</li>"
        wrapper: "<ul>{items}</ul>"
      node-count-by-type:
        header: "<strong>Node Count by Type:</strong>"
        item: "<li><em>{type}:</em> {count} nodes</li>"
        wrapper: "<ul>{items}</ul>"
      hint: '<p class="hint">{hint}</p>'

# ============================================================================
# SCHEMA STRUCTURE PATTERNS - 스키마 구조 감지 및 변환 규칙
# ============================================================================
# ⚠️ 이 패턴들은 schemaCompiler가 스키마를 파싱할 때 사용됨
#   - 래퍼 감지: Assign, Argument 등의 래퍼 키
#   - 엔티티 추출: additionalProperties 내부 스키마를 추출
#   - allOf 처리: if/then 조건부 검증 로직
# ============================================================================
schemaStructurePatterns:
  # 🔥 래퍼 키 정의 (API body-root)
  wrapperKeys:
    - key: "Assign"
      description: "DB PUT/POST - Map 기반 다중 엔티티"
      example: '{ "Assign": { "1": {...}, "2": {...} } }'
    - key: "Argument"
      description: "Function Call - 단일 인자 객체"
      example: '{ "Argument": {...} }'

  # 🔥 엔티티 컬렉션 패턴 (Assign/Argument 내부 구조)
  entityCollectionPattern:
    # 패턴 감지 조건 (모두 만족해야 함)
    detect:
      - path: "properties.*.type"
        value: "object"
      - path: "properties.*.additionalProperties"
        exists: true
    # 엔티티 추출 위치
    entityPath: "properties.{wrapperKey}.additionalProperties"
    # 엔티티 스키마에서 필드 추출
    fieldExtractionRules:
      properties: "properties"
      required: "required"
      allOf: "allOf"
      xUi: "x-ui"

  # 🔥 allOf if/then 패턴 - 조건부 검증 로직
  conditionalValidation:
    # allOf 배열에서 if/then 블록 추출
    pattern: "allOf[*].{if,then}"
    # if 블록 구조
    ifStructure:
      properties: "properties"     # { TYPE: { const: "BEAM" } }
      required: "required"         # ["TYPE"]
    # then 블록 구조
    thenStructure:
      required: "required"         # 조건부 required 필드들
      properties: "properties"     # 조건부 enum, minItems, maxItems 등

  # 🔥 조건부 required 매핑 생성 규칙
  conditionalRequiredMapping:
    # allOf[].if.properties.TYPE.const → conditionValue
    # allOf[].then.required → requiredFields
    # 결과: { "BEAM": ["SECT"], "TENSTR": ["SECT", "STYPE", "NON_LEN"], ... }
    conditionField: "TYPE"  # 기본 조건 필드 (대부분 TYPE)
    multiCondition: true    # TYPE + STYPE 같은 복합 조건 지원

  # 🔥 조건부 enum 매핑 생성 규칙
  conditionalEnumMapping:
    # allOf[].if.properties.TYPE.const → conditionValue
    # allOf[].then.properties.STYPE.enum → enumValues
    # 결과: { "TENSTR": [1,2,3], "COMPTR": [1,2], ... }
    extractFrom: "allOf[*].then.properties.*.enum"

  # 🔥 조건부 NODE 개수 매핑 생성 규칙
  conditionalNodeCountMapping:
    # allOf[].if.properties.TYPE.const → conditionValue
    # allOf[].then.properties.NODE.minItems/maxItems → nodeCount
    # 결과: { "BEAM": { min: 2, max: 2 }, "PLATE": { min: 3, max: 4 }, ... }
    extractFrom: "allOf[*].then.properties.NODE.{minItems,maxItems}"

  # 🔥 x-uiRules.visibleWhen → x-optional-when 변환 규칙
  # schemaCompiler에서 자동으로 x-optional-when으로 변환됨
  uiVisibilityRules:
    markerKey: "x-uiRules"
    visibleWhenPath: "visibleWhen"
    # ✅ 자동 변환: x-uiRules.visibleWhen → x-optional-when
    autoConvertTo: "x-optional-when"
    # 조건 필드 (TYPE, STYPE 등)
    supportedConditionFields:
      - "TYPE"
      - "STYPE"
      - "iMETHOD"
      - "bSELFWEIGHT"
    # 조건 형식 지원
    conditionFormats:
      single: "{ TYPE: 'TENSTR' }"           # 단일 값
      multi: "{ TYPE: 'TENSTR', STYPE: 3 }"  # 복합 조건

# ============================================================================
# TABLE SCHEMA REGISTRY - POST Table API 공통 타입 정의 (MCP SSOT)
# ============================================================================
# ⚠️ MCP가 Table 스키마 생성 시 이 레지스트리를 참조하여 일관된 구조 유지
# UI 스크린샷 → 스키마 생성 시 공통 필드는 여기서 가져옴
# 
# 참조 분석 기반:
#   - 013_Displacements_-_Analysis_Result_Table.html
#   - 024_Plate_Force_Local_-_Analysis_Result_Table.html
#   - 049_Elastic_Link_-_Analysis_Result_Table.html
#   - 019_Beam_Force_-_Analysis_Result_Table_enhanced.json
# ============================================================================
tableSchemaRegistry:
  version: "1.0.0"
  description: "POST Table API 공통 스키마 정의"

  # ────────────────────────────────────────────────────────────────────────────
  # 래퍼 구조 (모든 Table 스키마 공통)
  # ────────────────────────────────────────────────────────────────────────────
  wrapper:
    root: "TABLE"
    bodyRoot: "Argument"
    structure: |
      {
        "TABLE": {
          "$schema": "http://json-schema.org/draft-07/schema#",
          "title": "{schemaTitle}",
          "type": "object",
          "properties": {
            "Argument": { ... }
          }
        }
      }

  # ────────────────────────────────────────────────────────────────────────────
  # 공통 필드 정의 (COMMON FIELDS) - 대부분의 Table API에 공통
  # ────────────────────────────────────────────────────────────────────────────
  commonFields:
    TABLE_NAME:
      type: "string"
      description: "Response Table Title"
      default: ""
      required: false
      x-ui:
        label: "Table Name"
        hint: "Output table title in response"

    TABLE_TYPE:
      type: "string"
      description: "Result Table Type"
      required: true
      note: "enum values are table-specific (e.g., DISPLACEMENTG, BEAMFORCE)"
      x-ui:
        label: "Table Type"

    EXPORT_PATH:
      type: "string"
      description: "Result Table Save Path"
      required: false
      x-ui:
        label: "Export Path"
        hint: "Optional: Save results to file path"

    UNIT:
      type: "object"
      description: "Response Unit Setting"
      required: false
      properties:
        FORCE:
          type: "string"
          description: "Force unit"
        DIST:
          type: "string"
          description: "Length/Distance unit"
        HEAT:
          type: "string"
          description: "Heat unit"
        TEMP:
          type: "string"
          description: "Temperature unit"
      x-ui:
        label: "Unit Settings"

    STYLES:
      type: "object"
      description: "Response Number Format"
      required: false
      properties:
        FORMAT:
          type: "string"
          description: "Number format"
          enum: ["Default", "Fixed", "Scientific", "General"]
        PLACE:
          type: "integer"
          description: "Digit place"
          minimum: 0
          maximum: 15
      x-ui:
        label: "Number Format"

    COMPONENTS:
      type: "array"
      description: "Components of Result Table"
      items:
        type: "string"
      required: false
      note: "enum values are table-specific"
      x-ui:
        label: "Components"

    # NODE_ELEMS: 세 가지 방식 중 하나 사용 (KEYS, TO, STRUCTURE_GROUP_NAME)
    NODE_ELEMS:
      type: "object"
      description: "Node/Element No. Input"
      required: false
      properties:
        KEYS:
          type: "array"
          description: "Specify Each ID"
          items:
            type: "integer"
        TO:
          type: "string"
          description: "Specify ID Range (e.g., '1to160')"
        STRUCTURE_GROUP_NAME:
          type: "string"
          description: "Specify Structure Group Name"
      x-ui:
        label: "Node/Element Selection"
        hint: "Use only ONE of the three methods: KEYS, TO, or STRUCTURE_GROUP_NAME"

    LOAD_CASE_NAMES:
      type: "array"
      description: "Load Case/Combination Names"
      items:
        type: "string"
      required: false
      note: "Format: NAME(ST), NAME(CS), NAME(RS), NAME(CB) etc."
      x-ui:
        label: "Load Cases"
        hint: "Static Load or Load Combination names"

    OPT_CS:
      type: "boolean"
      description: "Activation - Construction Stage Step"
      default: false
      required: false
      x-ui:
        label: "Construction Stage"

    STAGE_STEP:
      type: "array"
      description: "Stage Step Names"
      items:
        type: "string"
      required: false
      x-ui:
        label: "Stage Steps"
      x-optional-when:
        OPT_CS: true

  # ────────────────────────────────────────────────────────────────────────────
  # 테이블별 고유 필드 (TABLE-SPECIFIC FIELDS)
  # ────────────────────────────────────────────────────────────────────────────
  tableSpecificFields:
    # ─── Displacement 전용 ───
    DISP_OPT:
      type: "string"
      description: "Displacement Option"
      enum: ["Accumulative", "Current", "Real"]
      tables: ["DISPLACEMENTG", "DISPLACEMENTL"]
      x-ui:
        label: "Displacement Option"

    # ─── Beam Force 전용 ───
    PARTS:
      type: "array"
      description: "Element Part Number"
      items:
        type: "string"
        enum: ["All", "PartI", "Part1/4", "Part2/4", "Part3/4", "PartJ"]
      default: ["All"]
      tables: ["BEAMFORCE", "BEAMFORCEVBM", "BEAMSTRESS"]
      x-ui:
        component: "CheckboxGroup"
        label: "Element Parts"

    BEAM_ITEM_TO_DISPLAY:
      type: "array"
      description: "Select Component to Display (Beam)"
      items:
        type: "string"
        enum: ["Force-x", "Shear-y", "Shear-z", "Moment-y", "Moment-z", "Torsion"]
      tables: ["BEAMFORCE", "BEAMFORCEVBM"]
      x-ui:
        label: "Beam Components to Display"

    # ─── Plate Force 전용 ───
    AVERAGE_NODAL_RESULT:
      type: "boolean"
      description: "Average Nodal Result Option"
      default: false
      tables: ["PLATEFORCEL", "PLATEFORCEG", "PLATESTRESS"]
      x-ui:
        label: "Average Nodal Result"

    # ─── Elastic Link 전용 ───
    LINK_ITEM_TO_DISPLAY:
      type: "array"
      description: "Select Component to Display (Elastic Link)"
      items:
        type: "string"
        enum: ["Axial", "Shear-y", "Shear-z", "Moment-x", "Moment-y", "Moment-z"]
      tables: ["ELASTICLINK", "ELASTICLINKVBM"]
      x-ui:
        label: "Link Components to Display"

    # ─── Element Type 선택 (일부 테이블) ───
    SELECT_TYPE:
      type: "string"
      description: "Element Type Selection"
      enum: ["TRUSS", "BEAM", "PLANE STRESS", "PLATE", "PLANE STRAIN", "AXISYMMETRIC", "SOLID", "TENS-TRUSS", "COMP-TRUSS"]
      tables: ["result-tables"]
      x-ui:
        label: "Select Type"

    # ─── Construction Stage Stress 전용 (STRESSCS) ───
    COMP_TENS:
      type: "array"
      description: "Compression/Tension Selection"
      items:
        type: "string"
        enum: ["All", "Compression", "Tension"]
      default: ["All"]
      tables: ["STRESSCS"]
      x-ui:
        component: "CheckboxGroup"
        label: "Comp./Tens."

    GIRDER_SLAB:
      type: "string"
      description: "Girder or Slab Selection"
      default: "GIRDER"
      oneOf:
        - title: "Girder"
          const: "GIRDER"
        - title: "Slab"
          const: "SLAB"
      tables: ["STRESSCS"]
      x-ui:
        component: "RadioGroup"
        label: "Girder/Slab"

    PARTS_CS:
      type: "array"
      description: "Part Number Selection (Construction Stage)"
      items:
        type: "string"
        enum: ["All", "Part_i", "Part_j"]
      default: ["All"]
      tables: ["STRESSCS"]
      x-ui:
        component: "CheckboxGroup"
        label: "Part Number"

  # ────────────────────────────────────────────────────────────────────────────
  # MCP 생성 규칙 (AI가 스키마 생성 시 참조)
  # ────────────────────────────────────────────────────────────────────────────
  generationRules:
    # 항상 포함해야 할 공통 필드
    alwaysInclude:
      - TABLE_NAME
      - TABLE_TYPE
      - EXPORT_PATH
      - UNIT
      - STYLES
      - COMPONENTS

    # 대부분 포함해야 할 필드
    usuallyInclude:
      - NODE_ELEMS
      - LOAD_CASE_NAMES

    # 조건부 포함 필드
    conditionalInclude:
      - field: OPT_CS
        condition: "Construction Stage 기능 있는 경우"
      - field: STAGE_STEP
        condition: "OPT_CS가 true일 때"
      - field: AVERAGE_NODAL_RESULT
        condition: "Plate/Solid 타입 결과 테이블"

    # UI 전용 요소 (스키마에 포함하지 않음)
    excludeFromSchema:
      - "All button"
      - "None button"
      - "Inverse button"
      - "Prev button"
      - "Add button"
      - "Delete button"
      - "Replace button"
      - "Intersect button"
      - "OK button"
      - "Cancel button"
      - "Help button"
      - "Close button"
      - "Select Type dropdown"  # 🚨 UI 전용 - 스키마에 포함 금지
      - "Element Type dropdown"  # 🚨 UI 전용 - 스키마에 포함 금지

    # NODE_ELEMS는 반드시 oneOf 패턴 사용
    nodeElemsRule: |
      NODE_ELEMS MUST always use oneOf pattern with 3 methods:
      1. KEYS (array of integers) - Specify each node/element ID
      2. TO (string, e.g., "1to5") - Specify ID range
      3. STRUCTURE_GROUP_NAME (string) - Specify structure group name

    # 🚨 불확실할 때 questions 파라미터 사용
    askQuestions:
      - "TABLE_TYPE enum 옵션이 1개만 보이면 전체 목록 질문"
      - "COMPONENTS의 enum 값이 불명확하면 질문"
      - "테이블별 특수 필드 존재 여부 불확실하면 질문"

